# Manual packaging rehearsal (#215, spec 04 X8). It publishes nothing.
#
# Run it from the Actions tab on any branch to get installers as 14-day workflow artifacts
# before cutting a release: macOS arm64 (dmg + zip), Windows x64 (NSIS), Linux x64 (AppImage +
# deb). The release itself is .github/workflows/release.yml, which builds the same way and
# publishes on a `v*` tag. There is no pull_request or tag trigger here: packaging on every PR
# was slow and duplicated the release build.
#
# Unsigned, and no secrets are read: CSC_IDENTITY_AUTO_DISCOVERY=false keeps electron-builder
# from signing with a stray keychain identity. None of these jobs installs the Windows or Linux
# artifacts: CI proves they build, not that they install (the macOS job launches the app).
name: Package

on:
  workflow_dispatch:

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.id }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: mac-arm64
            os: macos-26
            script: package:mac
            files: |
              apps/desktop/release/MangaVerse-*-arm64.dmg
              apps/desktop/release/MangaVerse-*-arm64.zip
          - id: win-x64
            os: windows-2025
            script: package:win
            files: |
              apps/desktop/release/MangaVerse-*-x64.exe
          - id: linux-x64
            os: ubuntu-24.04
            script: package:linux
            files: |
              apps/desktop/release/MangaVerse-*-x86_64.AppImage
              apps/desktop/release/MangaVerse-*-amd64.deb
    defaults:
      run:
        # One shell on every OS; the Windows default is PowerShell.
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds the workspace packages too, which the macOS packaged proof below needs.
      - name: Build desktop app
        run: pnpm --filter @app/desktop build

      # Architectures are pinned per target in apps/desktop/electron-builder.yml: no arch flags.
      - name: Package
        run: pnpm --filter @app/desktop run ${{ matrix.script }}

      - name: Assert the macOS app is arm64 only
        if: matrix.id == 'mac-arm64'
        run: test "$(lipo -archs apps/desktop/release/mac-arm64/MangaVerse.app/Contents/MacOS/MangaVerse)" = arm64

      # The packaged proof seeds its legacy snapshot through @app/db's built output.
      - name: Build @app/db for the packaged proof
        if: matrix.id == 'mac-arm64'
        run: pnpm exec turbo run build --filter=@app/db...

      - name: Packaged app proof (macOS)
        if: matrix.id == 'mac-arm64'
        run: pnpm --filter @app/desktop test:e2e:packaged

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mangaverse-${{ matrix.id }}
          path: ${{ matrix.files }}
          retention-days: 14
          if-no-files-found: error
