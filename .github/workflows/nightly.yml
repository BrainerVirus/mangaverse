# Nightly desktop builds from main. Every run is a unique immutable tag and a
# GitHub pre-release; stable releases remain manual tag releases from release.yml.
#
# No paid signing account: installers are unsigned/ad-hoc. The install scripts are
# attached so first users and updates can use one interface per OS (install.sh /
# install.ps1). See docs/nightly.md.
name: Nightly

on:
  schedule:
    # Daily at 04:17 UTC; avoid minute zero when GitHub scheduling is busiest.
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve nightly version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        run: |
          set -euo pipefail
          base=$(node -p "require('./apps/desktop/package.json').version.split('-')[0]")
          next=$(node -e "const [a,b,c]=process.argv[1].split('.').map(Number); console.log(a+'.'+b+'.'+(c+1))" "$base")
          date=$(date -u +%Y%m%d)
          version="${next}-nightly.${date}.${GITHUB_RUN_NUMBER}"
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "commit=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Nightly $version from $GITHUB_SHA"

  bundle:
    name: Build desktop bundle
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set nightly version
        env:
          NIGHTLY_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node -e "const fs=require('node:fs');const p='apps/desktop/package.json';const j=JSON.parse(fs.readFileSync(p));j.version=process.env.NIGHTLY_VERSION;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
      - run: pnpm --filter @app/desktop build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-dist
          path: apps/desktop/dist
          retention-days: 1
          if-no-files-found: error

  package:
    name: Package (${{ matrix.id }})
    needs: [prepare, bundle]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: mac-arm64
            os: macos-26
            script: package:mac
            files: |
              apps/desktop/release/MangaVerse-*-arm64.dmg
              apps/desktop/release/MangaVerse-*-arm64.zip
          - id: win-x64
            os: windows-2025
            script: package:win
            files: |
              apps/desktop/release/MangaVerse-*-x64.exe
              apps/desktop/release/MangaVerse-*-x64.zip
          - id: linux-x64
            os: ubuntu-24.04
            script: package:linux
            files: |
              apps/desktop/release/MangaVerse-*-x86_64.AppImage
              apps/desktop/release/MangaVerse-*-amd64.deb
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-dist
          path: apps/desktop/dist
      - name: Set nightly version
        env:
          NIGHTLY_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node -e "const fs=require('node:fs');const p='apps/desktop/package.json';const j=JSON.parse(fs.readFileSync(p));j.version=process.env.NIGHTLY_VERSION;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
      - name: Check the installer shell syntax
        run: sh -n scripts/install/install.sh
      - name: Parse the PowerShell installer
        if: matrix.id == 'win-x64'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/install/install.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors) { $errors | Format-List; exit 1 }
      - name: Package
        run: pnpm --filter @app/desktop run ${{ matrix.script }}
      - name: Assert the macOS app is arm64 only
        if: matrix.id == 'mac-arm64'
        run: test "$(lipo -archs apps/desktop/release/mac-arm64/MangaVerse.app/Contents/MacOS/MangaVerse)" = arm64
      - name: Assert the macOS app bundles the update helper
        if: matrix.id == 'mac-arm64'
        run: test -f apps/desktop/release/mac-arm64/MangaVerse.app/Contents/Resources/install/install.sh
      - name: Build @app/db for the packaged proof
        if: matrix.id == 'mac-arm64'
        run: pnpm exec turbo run build --filter=@app/db...
      - name: Packaged app proof (macOS)
        if: matrix.id == 'mac-arm64'
        run: pnpm --filter @app/desktop test:e2e:packaged
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-${{ matrix.id }}
          path: ${{ matrix.files }}
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Publish nightly pre-release
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nightly-*
          merge-multiple: true
          path: assets
      - name: Add installer scripts
        run: |
          cp scripts/install/install.sh scripts/install/install.ps1 assets/
      - name: Write SHA256SUMS
        working-directory: assets
        run: |
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: assets/*
      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          > **Unsigned nightly.** Not Developer ID-signed or notarized. Verify the SHA256SUMS
          > and build provenance before running. Apple Silicon only (no Intel build); Windows
          > x64; Linux x64.

          Install or update without admin:

          ```sh
          # macOS / Linux (channel defaults to nightly)
          curl -fsSL https://raw.githubusercontent.com/BrainerVirus/mangaverse/main/scripts/install/install.sh | sh
          ```

          ```powershell
          # Windows PowerShell
          irm https://raw.githubusercontent.com/BrainerVirus/mangaverse/main/scripts/install/install.ps1 | iex
          ```

          Uninstall:

          ```sh
          curl -fsSL https://raw.githubusercontent.com/BrainerVirus/mangaverse/main/scripts/install/install.sh | sh -s -- uninstall
          ```

          ```powershell
          $s = [scriptblock]::Create((irm https://raw.githubusercontent.com/BrainerVirus/mangaverse/main/scripts/install/install.ps1)); & $s -Action uninstall
          ```

          `--purge-data` / `-PurgeData` also removes local library data; the default keeps it.
          Windows SmartScreen and macOS Gatekeeper may warn because the build is unsigned.
          EOF
      - name: Create nightly pre-release
        run: |
          gh release create "$TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT" \
            --prerelease \
            --latest=false \
            --title "MangaVerse Nightly $VERSION" \
            --notes-file release-notes.md
