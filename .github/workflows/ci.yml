name: CI

on:
  # Pushes to main only: a branch with a pull request is covered by `pull_request`, so
  # listing feature branches here ran every check twice. release.yml requires a green run of
  # this workflow for the tagged commit on main.
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to a pull request supersedes the older run. Runs on main are never cancelled:
# release.yml looks for a successful run of this workflow at the exact commit it tags.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      # Full history: lint compares lint/baseline.json with its merge base on origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # oxlint, including the @shadcn/lint design-system plugin from .oxlintrc.json.
      - name: Lint
        run: pnpm lint

      # packages/db/src/routed.gen.ts must match a fresh, formatted generation (needs no build).
      - name: Routed client check
        run: pnpm --filter @app/db generate:routed --check

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # The runner has two cores. Uncapped Turbo concurrency started ~10 package
        # suites (each with jsdom workers) at once and pushed 100ms tests past the
        # 5s Vitest timeout. Bound the task concurrency instead of raising timeouts.
        run: pnpm exec turbo run test --concurrency=2 && node --test lint/state-baseline.test.mjs lint/ui-conventions.test.mjs

      - name: Build
        run: pnpm build

      # After the build: the turbo cache and the package dist/ trees are warm,
      # and a red gate fails the job before the slower E2E steps run.
      # react-doctor's cache lives in node_modules/.cache (not restored here),
      # so the scan is cold on CI.
      - name: Doctor
        run: pnpm run doctor

      - name: Knip
        run: pnpm knip

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @app/web exec playwright install-deps chromium

      - name: Install Chromium
        run: pnpm --filter @app/web exec playwright install chromium

      - name: Production web smoke test
        run: pnpm test:e2e:production
