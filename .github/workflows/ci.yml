name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: lint compares lint/baseline.json with its merge base on origin/main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # oxlint, including the @shadcn/lint design-system plugin from .oxlintrc.json.
      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # The runner has two cores. Uncapped Turbo concurrency started ~10 package
        # suites (each with jsdom workers) at once and pushed 100ms tests past the
        # 5s Vitest timeout. Bound the task concurrency instead of raising timeouts.
        run: pnpm exec turbo run test --concurrency=2 && node --test lint/state-baseline.test.mjs

      - name: Build
        run: pnpm build

      # After the build: the turbo cache and the package dist/ trees are warm,
      # and a red gate fails the job before the slower E2E steps run.
      # react-doctor's cache lives in node_modules/.cache (not restored here),
      # so the scan is cold on CI.
      - name: Doctor
        run: pnpm run doctor

      - name: Knip
        run: pnpm knip

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @app/web exec playwright install-deps chromium

      - name: Install Chromium
        run: pnpm --filter @app/web exec playwright install chromium

      - name: Production web smoke test
        run: pnpm test:e2e:production
