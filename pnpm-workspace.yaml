packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@parcel/watcher": true
  electron: true
  # Only Squirrel.Windows uses this; the Windows target is NSIS, so its download step is not needed.
  electron-winstaller: false
  esbuild: true
# A denied build script is an expected decision, not an install failure (electron-winstaller).
strictDepBuilds: false
