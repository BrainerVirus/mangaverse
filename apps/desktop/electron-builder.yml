# Packaging for the three desktop platforms (#215, spec 04 X8).
#
# v0.0.1 targets: macOS arm64 (dmg + zip), Windows x64 (NSIS), Linux x64 (AppImage + deb).
# Architectures are pinned per target here, so no `--arm64` / `--x64` flag is needed and a
# different host arch cannot change what is built. There is no macOS Intel build.
#
# Unsigned: with no CSC_LINK / Apple credentials electron-builder skips code signing and
# notarization, and the OS shows its normal install warning. Signing turns on by itself when
# the owner's certificates are in the environment (see docs/release.md).
#
# No auto-update feed: there is no `publish` block, so electron-builder writes no
# `app-update.yml` and the packaged app's updater stays disabled (src/main/updater.ts checks
# for that file). Release uploads are owned by .github/workflows/release.yml. To turn updates
# back on, see "Re-enabling auto-update" in docs/release.md.
appId: app.mangaverse.desktop
productName: MangaVerse
copyright: Copyright © 2026 MangaVerse
# The app runs from the asar: main, the data-host utility process and the preload are
# esbuild bundles, so no workspace symlinks or node_modules need to travel with it.
asar: true
# No native modules: node:sqlite ships inside Electron, so there is nothing to rebuild.
npmRebuild: false
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
  - "!**/*.map"
  - "!dist/e2e-results/**"
  - "!node_modules/**"
extraMetadata:
  main: dist/main/index.js
# Fuses flipped at package time (@electron/fuses). The unpackaged dev build and the Playwright
# E2E are untouched. `runAsNode` is safe to turn off: the data host is a `utilityProcess`, and
# nothing in the app uses `child_process` or ELECTRON_RUN_AS_NODE.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
# The fuses above rewrite the Electron Framework, which breaks the signature Electron ships with
# and gets the app SIGKILLed on Apple Silicon. electron-builder flips the fuses and signs, but an
# unsigned build is left broken. This hook (it runs after the fuses, before the dmg and zip)
# ad-hoc signs the .app only when it does not already verify; a real signing identity is left
# untouched. `afterPack` is too early: it runs before the fuses. See scripts/after-sign.mjs.
afterSign: scripts/after-sign.mjs
# `mangaverse://` deep links: Info.plist CFBundleURLTypes on macOS, the .desktop MimeType
# (x-scheme-handler) on Linux, the registry entry on Windows. main registers the same scheme at
# runtime with app.setAsDefaultProtocolClient.
protocols:
  - name: MangaVerse
    schemes:
      - mangaverse
mac:
  icon: build/icon.icns
  category: public.app-category.entertainment
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # dmg for people, zip for a future auto-updater. Apple Silicon only.
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: x64
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: false
linux:
  icon: build/icon.png
  # The package name is scoped (@app/desktop); AppImage rejects that executable name.
  executableName: mangaverse
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  category: Graphics;Viewer
  maintainer: MangaVerse
  artifactName: ${productName}-${version}-${arch}.${ext}
